version: '3.8'

services:
  lb:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - public_subnet
      - private_subnet
    depends_on:
      - backend-1
      - backend-2

  backend-1:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./server.js:/app/server.js:ro
    command: node server.js
    hostname: app-server-node-1
    networks:
      - private_subnet

  backend-2:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./server.js:/app/server.js:ro
    command: node server.js
    hostname: app-server-node-2
    networks:
      - private_subnet

networks:
  public_subnet:
    driver: bridge
  private_subnet:
    driver: bridge
    internal: true